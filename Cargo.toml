[package]
name = "cues"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
directories = "6.0.0"
ratatui = "0.30.2"
cli-log = "2.1.1"
# cpal = "0.18.2"
# symphonia = {version = "0.6.1", features = ["all-codecs"]}
ringbuf = "0.5.2"
rodio = "0.22.2"
num-traits = "0.2.19"
notify = "8.2.0"

# DON'T PANIC! https://www.namtao.com/rust-dont-panic/
[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
