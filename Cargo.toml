[workspace]
resolver = "3"
members = ["crates/keymaps", "crates/audio", "crates/cues", "crates/editor", "crates/tui-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[package]
name = "cues"
version.workspace = true
edition.workspace = true

[lib]
name = "cues"
path = "src/lib.rs"

[[bin]]
name = "cues"
path = "src/main.rs"

[dependencies]
cue_keymaps = { path = "crates/keymaps" }
cue_cues = { path = "crates/cues" }
cue_audio = { path = "crates/audio" }
cue_editor = { path = "crates/editor" }
cue_tui_core = { path = "crates/tui-core" }

color-eyre = "0.6.5"
directories = "6.0.0"
ratatui = "0.30.2"
cli-log = "2.1.1"
# cpal = "0.18.2"
# symphonia = {version = "0.6.1", features = ["all-codecs"]}
# ringbuf = "0.5.2"
rodio = "0.23.0"
num-traits = "0.2.19"
notify = "8.2.0"

# DON'T PANIC! https://www.namtao.com/rust-dont-panic/
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[lints]
workspace = true
